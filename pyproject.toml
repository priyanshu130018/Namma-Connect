[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "backend/app"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: tests requiring a running live HTTP server (concurrency, race conditions, live hardening)"
]

[tool.coverage.run]
source = ["backend/app"]
omit = [
    "*/tests/*",
    "*/alembic/*",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "node_modules",
    "frontend",
    "backend/alembic",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E402",
    "E501",
    "E711",
    "E712",
    "E722",
    "E741",
    "F401",
    "F403",
    "F405",
    "F811",
    "F821",
    "F841",
]

