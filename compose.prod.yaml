services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nammaconnect-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-namma_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set}
      POSTGRES_DB: ${POSTGRES_DB:-namma_connect_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-namma_user} -d ${POSTGRES_DB:-namma_connect_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nammaconnect-internal

  redis:
    image: redis:7-alpine
    container_name: nammaconnect-prod-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass "${REDIS_PASSWORD:-changeme_prod_redis_secret}"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_prod_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nammaconnect-internal

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: nammaconnect-prod-migration
    profiles:
      - migration
    env_file:
      - ${PROD_ENV_FILE:-.env}
    environment:
      ENV: production
      DEBUG: "False"
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    networks:
      - nammaconnect-internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: nammaconnect-prod-backend
    restart: always
    env_file:
      - ${PROD_ENV_FILE:-.env}
    environment:
      ENV: production
      DEBUG: "False"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4", "--proxy-headers", "--forwarded-allow-ips=127.0.0.1,172.16.0.0/12,10.0.0.0/8"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - nammaconnect-internal

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: nammaconnect-prod-worker
    restart: always
    env_file:
      - ${PROD_ENV_FILE:-.env}
    environment:
      ENV: production
      DEBUG: "False"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.core.celery_app worker
      -Q analytics,recommendation,nc_score,notification,translation
      -l INFO
      --concurrency=4
      --max-tasks-per-child=1000
    networks:
      - nammaconnect-internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: /api/v2
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_TOMTOM_API_KEY: ${VITE_TOMTOM_API_KEY:-}
    container_name: nammaconnect-prod-frontend
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - nammaconnect-internal

  proxy:
    image: nginx:1.27-alpine
    container_name: nammaconnect-prod-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ssl_certs:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - nammaconnect-internal

volumes:
  postgres_prod_data:
    name: nammaconnect_prod_postgres_data
  redis_prod_data:
    name: nammaconnect_prod_redis_data
  ssl_certs:
    name: nammaconnect_prod_ssl_certs

networks:
  nammaconnect-internal:
    name: nammaconnect_prod_network
    driver: bridge
