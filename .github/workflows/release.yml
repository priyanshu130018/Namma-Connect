name: Release & Deployment Pipeline

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g., v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: read
  packages: write

jobs:
  quality_gate:
    name: Validate Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/backend/requirements.txt pytest pytest-asyncio

      - name: Backend Syntax & Bytecode Compilation
        run: python -m compileall v2/backend

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: v2/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: v2/frontend
        run: npm ci

      - name: Frontend TypeScript Strict Check
        working-directory: v2/frontend
        run: npm run typecheck

      - name: Frontend Production Bundle Build
        working-directory: v2/frontend
        run: npm run build

  build_images:
    name: Build & Package Production Images
    needs: quality_gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./v2/backend
          file: ./v2/backend/Dockerfile
          target: production
          push: false
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:latest

      - name: Build Frontend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./v2/frontend
          file: ./v2/frontend/Dockerfile
          target: production
          push: false
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest
