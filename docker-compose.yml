# ==============================================================================
# Namma Connect V2 — Unified Development Docker Compose Configuration
# ==============================================================================
# Architecture: Frontend (Vite/React) -> Backend (FastAPI) -> PostgreSQL + Redis
# External integrations (Razorpay, Cloudinary, Resend, Gemini, Google) configured via .env
# ==============================================================================

services:
  # ── 1. Authoritative Relational Database (PostgreSQL 16) ──
  postgres:
    image: postgres:16-alpine
    container_name: nammaconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-namma_connect_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-namma_connect_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nammaconnect-net

  # ── 2. Cache & Background Task Broker (Redis 7) ──
  redis:
    image: redis:7-alpine
    container_name: nammaconnect-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - nammaconnect-net

  # ── 3. Application API Backend (FastAPI v2) ──
  backend:
    build:
      context: ./v2/backend
      dockerfile: Dockerfile
    container_name: nammaconnect-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PROJECT_NAME: Namma Connect
      ENV: development
      DEBUG: "True"
      API_V2_PREFIX: /api/v2
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-namma_connect_db}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-namma_connect_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-namma_connect_v2_development_jwt_secret_key_change_in_production_32b}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://127.0.0.1:5173"]'
      # External Integrations passed from host .env
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./v2/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nammaconnect-net

  # ── 4. Web Application Frontend (React 18 + Vite + Tailwind) ──
  frontend:
    build:
      context: ./v2/frontend
      dockerfile: Dockerfile
    container_name: nammaconnect-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v2
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./v2/frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nammaconnect-net

# ── Persistent Storage Volumes ──
volumes:
  postgres_data:
    name: nammaconnect_postgres_data
  redis_data:
    name: nammaconnect_redis_data

# ── Dedicated Container Network ──
networks:
  nammaconnect-net:
    name: nammaconnect_network
    driver: bridge
